name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-format:
    name: Build, test, and lint
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FrameFileTool.sln

      - name: Build
        run: dotnet build FrameFileTool.sln --no-restore -v quiet

      - name: Test
        run: dotnet test FrameFileTool.Tests/FrameFileTool.Tests.csproj --no-build -v quiet

      - name: Verify C# format
        run: dotnet format FrameFileTool.sln --verify-no-changes --severity warn --no-restore

      - name: Verify Markdown format
        run: npx markdownlint-cli2@0.22.1 "*.md" "docs/**/*.md" ".github/release-notes/*.md"
